name: hookguard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookguard}
      POSTGRES_DB: ${POSTGRES_DB:-hookguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hookguard} -d ${POSTGRES_DB:-hookguard}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hookguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hookguard}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/HookGuard.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__HookGuard: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-hookguard};Username=${POSTGRES_USER:-hookguard};Password=${POSTGRES_PASSWORD:-hookguard}"
      Dependencies__Postgres: postgres:5432
      Dependencies__Redis: redis:6379
      Dependencies__RabbitMq: rabbitmq:5672
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: src/HookGuard.Workers/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Dependencies__Postgres: postgres:5432
      Dependencies__Redis: redis:6379
      Dependencies__RabbitMq: rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  fake-merchant:
    build:
      context: .
      dockerfile: src/HookGuard.FakeMerchant/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${FAKE_MERCHANT_PORT:-9000}:8080"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
