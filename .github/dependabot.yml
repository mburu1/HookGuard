version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /src/HookGuard.Api
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /src/HookGuard.Workers
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /src/HookGuard.FakeMerchant
    schedule:
      interval: monthly
